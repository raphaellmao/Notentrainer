<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notentrainer</title>
  <meta name="description" content="Noten lesen lernen fürs Klavier: Note sehen, passende Taste tippen.">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Notentrainer">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-view="play">
  <header class="bar">
    <div class="seg mode" role="radiogroup" aria-label="Schlüssel">
      <button type="button" role="radio" data-mode="treble" aria-checked="true">Violin</button>
      <button type="button" role="radio" data-mode="bass" aria-checked="false">Bass</button>
      <button type="button" role="radio" data-mode="mixed" aria-checked="false">Gemischt</button>
    </div>
    <button type="button" class="icon-btn" id="sound" aria-pressed="true" aria-label="Ton">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="speaker" d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z"/>
        <path class="waves" d="M15.2 9.2a4 4 0 0 1 0 5.6M17.6 6.8a7.4 7.4 0 0 1 0 10.4"/>
        <path class="mute" d="M15.5 9.5l5 5m0-5l-5 5"/>
      </svg>
    </button>
    <div class="seg level" role="radiogroup" aria-label="Stufe">
      <button type="button" role="radio" data-level="1" aria-checked="true" title="nur Noten ohne Hilfslinien">Stufe 1</button>
      <button type="button" role="radio" data-level="2" aria-checked="false" title="mit Hilfslinien">Stufe 2</button>
    </div>
    <div class="count">Note <b id="count">1</b>/<span id="total">20</span></div>
  </header>
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>

  <main>
    <section class="stage" aria-label="Übung">
      <div class="paper" id="staff"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
    </section>

    <section class="summary" aria-labelledby="summary-title">
      <h2 id="summary-title">Runde geschafft</h2>
      <div class="totals">
        <div><b id="sum-score"></b><span id="sum-rate"></span></div>
        <div><b id="sum-time"></b><span>im Schnitt pro Note</span></div>
      </div>
      <h3 id="sum-wrong-title">Diese Noten waren falsch</h3>
      <div class="wrong-list" id="sum-wrong"></div>
      <p class="all-right" id="sum-all-right" hidden>Alles richtig – stark!</p>
      <button type="button" class="primary" id="again">Nochmal</button>
    </section>
  </main>

  <div class="keys"><div id="keyboard" aria-label="Klaviatur"></div></div>
</body>
</html>
